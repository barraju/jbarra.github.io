<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="nav-toggle" aria-label="Ouvrir le menu"
            aria-controls="site-nav" aria-expanded="false">&#9776;</button>
    <nav class="site-nav" id="site-nav">
      {% assign nav_pages = site.html_pages | where: "nav", true | sort: "order" %}
      {% for p in nav_pages %}
        <a href="{{ p.url | relative_url }}"{% if p.url == page.url %} class="active"{% endif %}>{{ p.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
